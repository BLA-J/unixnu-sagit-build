name: build-sagit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-sagit
  cancel-in-progress: false

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout UniXNU (pinned)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu-src
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          submodules: recursive

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-v1

      - name: Install host packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3 4 5; do
            sudo apt-get update -qq &&
            sudo apt-get install -y --no-install-recommends \
              git patch flex bison bzip2 cpio rsync curl wget ca-certificates tcsh unifdef \
              cmake clang lld mtools gettext \
              build-essential pkg-config ninja-build python3 python3-dev xz-utils \
              libssl-dev zlib1g-dev libbsd-dev uuid-dev llvm-dev libclang-dev device-tree-compiler && exit 0
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "apt install failed after 5 attempts" >&2
          exit 1

      - name: Build UniXNU Linux toolchain
        run: |
          set -euo pipefail
          if [ ! -x /opt/unixnu-linux/llvm/bin/clang ]; then
            sudo env TMPDIR="${RUNNER_TEMP:-/tmp}" python3 unixnu-src/scripts/linux/setup-toolchain.py /opt/unixnu-linux -j "$(nproc)"
          fi
          sudo env TMPDIR="${RUNNER_TEMP:-/tmp}" python3 unixnu-src/scripts/linux/setup-toolchain.py --check
          sudo chown -R "$(id -u):$(id -g)" /opt/unixnu-linux

  build:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout UniXNU (pinned)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu-src
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          submodules: recursive

      - name: Checkout unixnu-sagit
        uses: actions/checkout@v4
        with:
          repository: ilertnost/unixnu-sagit
          path: unixnu-sagit

      - name: Checkout edk2-msm8998
        uses: actions/checkout@v4
        with:
          repository: edk2-porting/edk2-msm8998
          ref: new
          path: edk2-msm8998
          submodules: recursive

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-v1

      - name: Build
        run: bash build.sh

      - name: Upload boot-sagit.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-sagit
          if-no-files-found: ignore
          retention-days: 7
          path: |
            edk2-msm8998/workspace/out/boot-sagit.img
            unixnu-sagit/out/sagit-payload-volume.img
            unixnu-sagit/out/sagit-payload-volume.ramdisk
